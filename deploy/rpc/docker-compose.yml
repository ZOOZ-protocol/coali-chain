# Public access server: archive RPC node, Coaliscan explorer (scan + static site), Polkadot.js Apps, faucet, Caddy (TLS),
# the finality watchdog / price oracle. The relayer runs on a validator server (deploy/relayer).
# Expects: .env (DOMAIN, ACME_EMAIL, IMAGE), spec/coali-testnet-raw.json, faucet.env (FAUCET_URI),
# watchdog.env (WATCHDOG_URI: proxy key limited to forced finality changes; ORACLE_URI: oracle account).
# No sudo key on this server (security/AUDIT-PRE-2026-10.md, ZOOZ-08).
services:
  rpc:
    image: ${IMAGE:-coali-node:testnet}
    container_name: coali-rpc
    restart: unless-stopped
    command:
      - --chain=/spec/coali-testnet-raw.json
      - --base-path=/data
      - --name=coali-rpc
      - --port=30333
      - --rpc-port=9944
      - --rpc-external
      - --rpc-methods=safe
      - --rpc-cors=all
      - --rpc-max-connections=500
      # Public limits: per connection, calls per minute, batch length and subscriptions. Only the
      # internal services, at fixed addresses on the backend network, are exempt; proxy headers
      # are not trusted (visitors all come through Caddy, on the default network).
      - --rpc-rate-limit=1800
      - --rpc-rate-limit-whitelisted-ips=10.77.0.11/32
      - --rpc-rate-limit-whitelisted-ips=10.77.0.12/32
      - --rpc-rate-limit-whitelisted-ips=10.77.0.13/32
      - --rpc-max-batch-request-len=50
      - --rpc-max-subscriptions-per-connection=256
      - --state-pruning=archive
      - --blocks-pruning=archive-canonical
    ports:
      - "30333:30333"
    networks:
      default: {}
      backend:
        ipv4_address: 10.77.0.2
        aliases: [rpc-internal]
    volumes:
      - rpc-data:/data
      - ./spec:/spec:ro

  explorer:
    image: jacogr/polkadot-js-apps:latest
    container_name: coali-explorer
    restart: unless-stopped
    environment:
      WS_URL: wss://rpc.${DOMAIN}

  caddy:
    image: caddy:2
    container_name: coali-caddy
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./site:/srv/site:ro
      - ./explorer:/srv/explorer:ro
      - ./spec:/srv/spec:ro
      - /opt/coali-downloads:/srv/downloads:ro
      - caddy-data:/data

  faucet:
    build: ../../faucet
    container_name: coali-faucet
    restart: unless-stopped
    networks:
      default: {}
      backend:
        ipv4_address: 10.77.0.12
    env_file: faucet.env
    environment:
      CHAIN_WS: ws://rpc-internal:9944
      PORT: "8080"
    volumes:
      - faucet-data:/data
    depends_on: [rpc]

  scan:
    build: ../../scan
    container_name: coali-scan
    restart: unless-stopped
    networks:
      default: {}
      backend:
        ipv4_address: 10.77.0.11
    environment:
      CHAIN_WS: ws://rpc-internal:9944
      DB_PATH: /data/scan.db
      # Name tags shown in the explorer (address=Name, comma-separated).
      LABELS: 5Ece69BkcArVJVVRhrezvMYFf6rtyT5ohsyRChqizQhEFcxM=Popolitica,5Gxe4rSwUpDXHkZQxw48uweZGpXvJLL4EWqHAsUkQJvg16at=Faucet
    volumes:
      - scan-data:/data
    depends_on: [rpc]

  watchdog:
    build: ../../watchdog
    container_name: coali-watchdog
    restart: unless-stopped
    networks:
      default: {}
      backend:
        ipv4_address: 10.77.0.13
    env_file: watchdog.env
    environment:
      CHAIN_WS: ws://rpc-internal:9944
    volumes:
      - watchdog-data:/data
    depends_on: [rpc]

networks:
  # Internal services reach the node here, from fixed addresses exempt from the rate limit.
  backend:
    ipam:
      config:
        - subnet: 10.77.0.0/24

volumes:
  rpc-data:
  caddy-data:
  scan-data:
  faucet-data:
  watchdog-data:
